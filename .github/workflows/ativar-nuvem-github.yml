name: Ativar nuvem privada\non:\n  push:\n    paths:\n      - .github/workflows/ativar-nuvem-github.yml\npermissions:\n  contents: write\njobs:\n  activate:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n      - run: |\n          git show 4466caace9e542a093b92367344b72802aed46a8:index.html > index.html\n          echo  | base64 -d | gzip -d > cloud-github.js\n          printf '\n<script src="cloud-github.js"></script>\n' >> index.html\n          git config user.name github-actions[bot]\n          git config user.email 41898282+github-actions[bot]@users.noreply.github.com\n          git add index.html cloud-github.js\n          git commit -m "Ativa nuvem privada pelo GitHub" || exit 0\n          git push\n