name: Restaurar painel
on:
  push:
    paths:
      - .github/workflows/restaurar-painel.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git show 4466caa:index.html > index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Restaurar painel profissional" || exit 0
          git push
