<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Diário de Vendas</title><style>body{margin:0;background:#f3f7fb;color:#182b3e;font:15px Arial,sans-serif}.w{max-width:900px;margin:auto;padding:16px}.hero{background:#17365d;color:#fff;padding:22px;border-radius:18px}.hero h1{margin:0;font-size:27px}.hero p{margin:8px 0 0;color:#d9eaf7}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.card{background:#fff;border:1px solid #dbe5ef;border-radius:14px;padding:14px}.lab,small{color:#61748a;font-size:13px}.num{font-size:22px;font-weight:800;color:#17365d;margin-top:5px}h2{font-size:18px;color:#17365d;margin:22px 0 9px}.row{display:grid;grid-template-columns:1fr 75px 75px 110px;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #dbe5ef}input,select,textarea,button{font:inherit}input,select,textarea{box-sizing:border-box;width:100%;padding:9px;border:1px solid #dbe5ef;border-radius:9px}input[type=number]{text-align:center;font-weight:700}.barbg{height:7px;background:#e8eef4;border-radius:8px;margin-top:7px}.bar{height:7px;background:#00a6a6;border-radius:8px}.tag{padding:5px;text-align:center;border-radius:16px;background:#fff2cc;color:#805700;font-size:12px;font-weight:bold}.ok{background:#dcf4e4;color:#16703a}.btn{background:#1f4e78;color:#fff;border:0;border-radius:9px;padding:10px 12px;font-weight:bold}.tool{display:flex;justify-content:space-between;align-items:center}.table{overflow:auto;background:#fff;border:1px solid #dbe5ef;border-radius:12px;margin-top:9px}table{border-collapse:collapse;min-width:700px;width:100%}th{background:#1f4e78;color:white;padding:10px;text-align:left}td{padding:7px;border-bottom:1px solid #dbe5ef}textarea{min-height:55px}label{display:block;color:#17365d;font-weight:bold;margin:12px 0 5px}@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 60px 60px}.tag{grid-column:1/-1}}</style><body><main class="w"><div class="hero"><h1>Painel diário de vendas</h1><p>Contratos e pacotes de animação — metas, funil e fechamento.</p></div><h2>Resultado do dia</h2><div class="g"><div class="card"><div class="lab">Meta</div><div class="num" id="goal"></div></div><div class="card"><div class="lab">Vendido</div><div class="num" id="sold"></div></div><div class="card"><div class="lab">Falta</div><div class="num" id="left"></div></div><div class="card"><div class="lab">Dízimo</div><div class="num" id="tithe"></div></div></div><h2>Metas de atividade</h2><div class="card" id="acts"></div><div class="tool"><div><h2>Funil do dia</h2><small>Toda conversa termina com uma próxima ação.</small></div><button class="btn" onclick="add()">+ Lead</button></div><div class="table"><table><thead><tr><th>Lead</th><th>Etapa</th><th>Valor</th><th>Próxima ação</th><th></th></tr></thead><tbody id="leads"></tbody></table></div><section class="card" style="margin-top:18px"><h2>Fechamento do dia</h2><label>Maior avanço</label><textarea id="advance"></textarea><label>Pendência de amanhã</label><textarea id="pending"></textarea><label>3 primeiras ações</label><textarea id="tomorrow"></textarea><p><button class="btn" onclick="saveAll()">Salvar meu dia</button></p></section></main><script>const K="painel-gomes",A=[["Novos contatos",20],["Follow-ups",15],["Leads qualificados",5],["Reuniões",3],["Propostas",3],["Pedidos de indicação",5]],S=["Novo lead","Qualificado","Proposta enviada","Negociação","Fechado","Perdido"];let d=JSON.parse(localStorage.getItem(K)||"{}");d.a??={};d.l??=[];d.g??=875;const R=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),save=()=>localStorage.setItem(K,JSON.stringify(d));function acts(){document.getElementById("acts").innerHTML=A.map((x,i)=>{let v=+d.a[i]||0,p=Math.min(100,v/x[1]*100),o=v>=x[1];return `<div class="row"><div><b>${x[0]}</b><div class="barbg"><div class="bar" style="width:${p}%"></div></div></div><input type="number" min="0" value="${v}" oninput="d.a[${i}]=this.value;save();acts()"><div><b>${Math.max(0,x[1]-v)}</b><br><small>faltam</small></div><span class="tag ${o?"ok":""}">${o?"Meta cumprida":"Em andamento"}</span></div>`}).join("")}function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("\"","&quot;").replaceAll("<","&lt;")}function funil(){leads.innerHTML=d.l.map((x,i)=>`<tr><td><input value="${esc(x.n)}" oninput="ed(${i},\"n\",this.value)"></td><td><select onchange="ed(${i},\"s\",this.value)">${S.map(q=>`<option ${x.s===q?"selected":""}>${q}</option>`).join("")}</select></td><td><input type="number" value="${x.v||""}" oninput="ed(${i},\"v\",this.value)"></td><td><input value="${esc(x.p)}" oninput="ed(${i},\"p\",this.value)"></td><td><button onclick="del(${i})">×</button></td></tr>`).join("")||"<tr><td colspan=5 style=\"text-align:center;padding:20px\">Adicione seus contatos.</td></tr>"}function ed(i,k,v){d.l[i][k]=v;save();metrics()}function add(){d.l.push({s:"Novo lead"});save();funil()}function del(i){d.l.splice(i,1);save();all()}function metrics(){let v=d.l.filter(x=>x.s==="Fechado").reduce((a,x)=>a+(+x.v||0),0);goal.textContent=R(d.g);sold.textContent=R(v);left.textContent=R(Math.max(0,d.g-v));tithe.textContent=R(v*.1)}function saveAll(){["advance","pending","tomorrow"].forEach(x=>d[x]=document.getElementById(x).value);save();alert("Dia salvo.")}function all(){acts();funil();metrics();["advance","pending","tomorrow"].forEach(x=>document.getElementById(x).value=d[x]||"")}all()</script></body></html>
